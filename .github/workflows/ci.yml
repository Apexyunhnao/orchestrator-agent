name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # CI 注入**固定的测试专用** secret（不是真实密钥）：
      # 认证是 fail-closed 的 —— 不配 AUTH_SECRET 服务会直接拒绝启动。
      # 这里给一个明确写死的测试值，避免把任何真实密钥带进 CI。
      AUTH_SECRET: ci-test-only-secret-not-a-real-key
      # 单测全部 mock 掉了 LLM 调用，这里只占位，保证 import 阶段不报错
      DEEPSEEK_API_KEY: ci-placeholder-unused-by-mocked-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 冷安装（锁文件，与 Dockerfile 用的是同一份）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 导入检查
        run: python -c "import main; print('import main OK')"

      - name: 测试
        run: |
          python tests/test_auth.py
          python tests/test_integration.py
          python tests/test_context_isolation.py

      - name: 启动 smoke（起服务 → 健康检查 → 认证边界）
        run: |
          set -e
          python -m uvicorn main:app --host 127.0.0.1 --port 8010 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/health >/dev/null 2>&1 && break
            sleep 1
          done
          echo "health: $(curl -s http://127.0.0.1:8010/health)"
          # fail-closed 的认证边界：未登录访问受保护端点必须是 401（不是 200、也不是 500）
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/stats)
          echo "未登录访问 /stats -> $code"
          test "$code" = "401"
